<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>REACH · Admin</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="manifest" href="admin.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#1d4ed8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.bar2 input{flex:1 1 220px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{border-radius:20px;padding:16px 18px;color:#fff}.stat b{display:block;font:800 2rem "Bricolage Grotesque",sans-serif}.stat small{font-weight:700;color:rgba(255,255,255,.92)}
.stat:nth-child(1){background:linear-gradient(135deg,#1d4ed8,#4f8cff)}.stat:nth-child(2){background:linear-gradient(135deg,#ff4d9d,#ff8cc0)}.stat:nth-child(3){background:linear-gradient(135deg,#0ea5e9,#67d0ff)}.stat:nth-child(4){background:linear-gradient(135deg,#2563ff,#ff4d9d)}
.tabs2{display:flex;gap:6px;background:#eaf1ff;border-radius:16px;padding:5px;margin:16px 0;overflow-x:auto}
.tabs2 button{flex:1;white-space:nowrap;border:0;background:none;font:800 .92rem Manrope,system-ui,sans-serif;padding:11px 14px;border-radius:12px;cursor:pointer;color:var(--muted)}.tabs2 button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px -4px rgba(37,99,255,.5)}
details{background:#fff;border:1.5px solid var(--line);border-radius:20px;margin-top:10px;overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px}summary::-webkit-details-marker{display:none}
.av{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font:800 1.15rem "Bricolage Grotesque",sans-serif;flex:none;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
summary .t{flex:1;min-width:0}summary b{display:block}summary span.m{color:var(--muted);font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
.inner{padding:4px 16px 16px;border-top:1.5px solid var(--line)}
.ucard{margin-top:12px;padding:14px;border:1.5px solid var(--line);border-radius:18px;background:#f8fbff}
.ucard h3{font-size:1.02rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.info{font-weight:600;font-size:.88rem;color:var(--muted);margin:6px 0;line-height:1.5}
.inner .row input{flex:1 1 130px;padding:10px 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fb{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}.fb .st{letter-spacing:2px}
#login{max-width:400px;margin:8vh auto}
.help{background:linear-gradient(135deg,#eef4ff,#fff0f7);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;font-weight:600;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.warn{background:#fff4e5;border:1.5px solid #ffcf8a;color:#7a4a00;border-radius:16px;padding:12px 16px;font-weight:700;margin-top:14px}.mc{margin:8px 0 10px}.mc canvas{display:block}
</style></head><body>
<header class="top"><a class="brand" href="./"><img src="logo-mark.png" alt="">REACH ADMIN</a><button class="btn ghost hide" id="out">Log out</button></header>
<div class="wrap">
<div id="boot"><div class="spin"></div></div>

<div id="login" class="card hide">
  <h2>Admin login</h2><p class="sub">Only Muhadeen can enter.</p>
  <form id="lf" novalidate><label for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Password</label><div class="pw"><input id="pw" type="password" autocomplete="current-password"><button type="button" id="sp">Show</button></div>
  <p class="err" id="err"></p><button class="btn accent block" style="margin-top:8px">Log in</button><div style="text-align:center"><button type="button" class="link" id="fg">Forgot password?</button></div></form>
</div>

<div id="app" class="hide">
  <div class="stats"><div class="stat"><b id="sU">0</b><small>Users</small></div><div class="stat"><b id="sC">0</b><small>Cards</small></div><div class="stat"><b id="sV">0</b><small>Card views</small></div><div class="stat"><b id="sF">0</b><small>Feedback</small></div></div>
  <div id="warn" class="warn hide"></div>
  <div class="tabs2" id="tabs"><button data-t="users" class="on">👥 Users</button><button data-t="stats">📊 Analytics</button><button data-t="fb">💬 Feedback</button><button data-t="msg">✉️ Messages <span id="mCnt"></span></button></div>

  <div id="p-users">
    <div class="help">Forgot-password help: open the user, check you're talking to the right person, then tap <b>Send reset email</b>. Firebase emails them a link to choose a new password.</div>
    <div class="bar2"><input id="q" type="search" placeholder="Search by name, email, company or platform…"><button class="btn accent" id="xl">⬇ Download Excel</button><button class="btn ghost" id="rf">Refresh</button></div>
    <div id="users"></div>
  </div>
  <div id="p-stats" class="hide"><div class="card" id="aBody"></div></div>
  <div id="p-fb" class="hide"><div id="fbList"></div></div>
  <div id="p-msg" class="hide"><p class="sub" style="margin-top:6px">Messages sent from the Contact page.</p><div id="msgList"></div></div>
</div>
</div>
<div class="modal hide" id="mCard"><div class="mbox wide"><h2 id="mcTitle">Card</h2><p class="sub" id="mcSub"></p><div id="mcBody"></div><div class="mact"><button class="btn ghost" id="mcClose" type="button">Close</button></div></div></div>
<script src="core.js"></script>
<script src="cardgen.js"></script>
<script>
let db,auth,U=[],cardsAll=[],hitsAll=[],fbAll=[],loadedHits=false;
function show(v){["boot","login","app"].forEach(x=>$("#"+x).classList.toggle("hide",x!==v));$("#out").classList.toggle("hide",v!=="app")}
(async()=>{
  try{const f=await fb();db=f.db;auth=f.auth;loadJs(QR_URL).catch(()=>{})}catch(e){$("#boot").innerHTML='<p class="err" style="text-align:center">Could not load. Refresh.</p>';return}
  await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  auth.onAuthStateChanged(async u=>{
    if(!u){show("login");return}
    if((u.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await auth.signOut();$("#err").textContent="This account isn't allowed in the admin area.";show("login");return}
    show("boot");await load();show("app")})
})();
const shake=()=>{const b=$("#login");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")};
$("#lf").onsubmit=async e=>{e.preventDefault();$("#err").textContent="";$("#err").className="err";
  try{await auth.signInWithEmailAndPassword($("#em").value.trim().toLowerCase(),$("#pw").value)}catch(x){$("#err").textContent=authMsg(x.code);shake()}};
$("#sp").onclick=()=>{const i=$("#pw"),s=i.type==="password";i.type=s?"text":"password";$("#sp").textContent=s?"Hide":"Show"};
$("#fg").onclick=async()=>{const em=$("#em").value.trim().toLowerCase(),e=$("#err");
  if(!em){e.className="err";return e.textContent="Type your email above first."}
  try{await auth.sendPasswordResetEmail(em)}catch(x){if(x.code==="auth/invalid-email"){e.className="err";return e.textContent=authMsg(x.code)}}
  e.className="err ok";e.textContent="If that email has an account, a reset link is on its way. Check spam too."};
$("#out").onclick=()=>auth.signOut();$("#rf").onclick=async()=>{await load(true);toast("Refreshed")};

let failed=[],msgsAll=[];
async function load(){
  const q=(n,lim)=>{let c=db.collection(n);if(lim)c=c.limit(lim);return c.get()};
  const names=["users","private","cards","feedback","hits","messages"];
  const rs=await Promise.allSettled([q("users"),q("private"),q("cards"),q("feedback"),q("hits"),q("messages")]);
  failed=names.filter((n,i)=>rs[i].status!=="fulfilled");
  const why=names.map((n,i)=>rs[i].status!=="fulfilled"?n+" ("+((rs[i].reason&&rs[i].reason.code)||"error")+")":null).filter(Boolean);
  const g=i=>rs[i].status==="fulfilled"?rs[i].value.docs:[];
  const priv={};g(1).forEach(d=>priv[d.id]=d.data());
  cardsAll=g(2).map(d=>({id:d.id,...d.data()}));
  U=g(0).map(d=>{const v=d.data(),p=priv[d.id]||{};return{id:d.id,name:v.name||p.name||"(no name)",email:p.email||"",createdAt:ms(v.createdAt),cards:cardsAll.filter(c=>c.owner===d.id).sort((a,b)=>ms(a.createdAt)-ms(b.createdAt))}}).sort((a,b)=>b.createdAt-a.createdAt);
  fbAll=g(3).map(d=>({id:d.id,...d.data(),ts:ms(d.data().ts)})).sort((a,b)=>b.ts-a.ts);
  hitsAll=g(4).map(d=>{const v=d.data();return{...v,ts:ms(v.ts)||Date.now()}});loadedHits=true;
  msgsAll=g(5).map(d=>({id:d.id,...d.data(),ts:ms(d.data().ts)})).sort((a,b)=>b.ts-a.ts);
  $("#sV").textContent=hitsAll.filter(h=>h.type==="view").length;
  const w=$("#warn");w.classList.toggle("hide",!failed.length);
  if(failed.length)w.innerHTML="⚠️ Couldn't read: <b>"+why.join(", ")+"</b>. If it says permission-denied, publish the latest Firestore rules from the README. Then tap Refresh.";
  render();renderFb();renderMsgs()}

function render(){
  const q=norm($("#q").value||"");
  const hay=u=>u.name+u.email+u.cards.map(c=>c.label+c.name+c.company+c.title+(c.platforms||[]).map(p=>p.name+p.detail).join("")).join("");
  const list=U.filter(u=>!q||norm(hay(u)).includes(q));
  $("#sU").textContent=U.length;$("#sC").textContent=cardsAll.length;$("#sF").textContent=fbAll.length;
  const open=new Set($$("details[open]").map(d=>d.dataset.id));
  $("#users").innerHTML=list.length?list.map(u=>{const np=u.cards.reduce((a,c)=>a+(c.platforms||[]).length,0),ph=u.cards.map(c=>safeImg(c.photo)).find(Boolean);
    return `<details data-id="${u.id}" ${open.has(u.id)?"open":""}>
    <summary><div class="av">${ph?`<img src="${ph}" alt="">`:esc(u.name[0].toUpperCase())}</div><div class="t"><b>${esc(u.name)}</b><span class="m">${esc(u.email)} · ${u.cards.length} card${u.cards.length===1?"":"s"} · ${np} platforms · joined ${when(u.createdAt)}</span></div><span class="pill">Open</span></summary>
    <div class="inner"><div class="tools"><button class="btn" data-act="reset" data-uid="${u.id}">✉️ Send reset email</button><button class="btn ghost" data-act="deluser" data-uid="${u.id}" style="color:#d6204a">Delete user data</button></div>
    ${u.cards.map(c=>`<div class="ucard"><h3>${esc(c.label||"Card")} <span class="pill">${esc(c.type||"personal")}</span></h3>
      <div class="info">${[c.name,c.title,c.company,c.address,c.website,c.officePhone&&"Office: "+c.officePhone,c.businessWhatsApp&&"WhatsApp: "+c.businessWhatsApp].filter(Boolean).map(esc).join(" · ")}</div>
      ${(c.platforms||[]).length?c.platforms.map(p=>`<div class="row edit" data-cid="${c.id}" data-pid="${p.id}">${logo(p.name,40,p.detail)}<input data-f="name" value="${esc(p.name)}"><input data-f="detail" value="${esc(p.detail)}"><button class="ic" data-act="save" title="Save">✓</button><button class="ic danger" data-act="del" title="Delete">🗑</button></div>`).join(""):'<div class="empty">No platforms yet.</div>'}
      <div class="tools"><button class="btn" data-act="qr" data-cid="${c.id}">🔳 QR &amp; cards</button><a class="btn ghost" href="${esc(cardUrl(c.id))}" target="_blank" rel="noopener">Open card ↗</a><button class="btn ghost" data-act="delcard" data-cid="${c.id}" style="color:#d6204a">Delete card</button></div></div>`).join("")||'<div class="empty">No cards yet.</div>'}</div></details>`}).join(""):'<div class="empty">No users yet.</div>'}
$("#q").oninput=render;

$("#users").onclick=async e=>{const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act==="reset"){const u=U.find(x=>x.id===b.dataset.uid);if(!u.email)return toast("No email on file for this user");
    if(!confirm("Send a password reset email to "+u.email+"?"))return;
    try{await auth.sendPasswordResetEmail(u.email);toast("Reset email sent to "+u.email)}catch(x){toast("Couldn't send: "+(x.code||"error"))}return}
  if(act==="deluser"){const u=U.find(x=>x.id===b.dataset.uid);
    if(!confirm("Delete all card data for "+u.name+"? (Their login account stays in Firebase Authentication.)"))return;
    try{for(const c of u.cards)await db.collection("cards").doc(c.id).delete();await db.collection("users").doc(u.id).delete();await db.collection("private").doc(u.id).delete();await load();toast("User data deleted")}catch(x){toast("Failed")}return}
  if(act==="qr")return openCardModal(b.dataset.cid);
  if(act==="delcard"){const c=cardsAll.find(x=>x.id===b.dataset.cid);if(!confirm("Delete the card “"+(c.label||c.name)+"”?"))return;
    try{await db.collection("cards").doc(c.id).delete();await load();toast("Card deleted")}catch(x){toast("Failed")}return}
  const row=b.closest(".row"),c=cardsAll.find(x=>x.id===row.dataset.cid),pl=[...(c.platforms||[])],i=pl.findIndex(p=>p.id===row.dataset.pid);
  if(act==="save"){const name=$('[data-f="name"]',row).value.trim(),detail=$('[data-f="detail"]',row).value.trim();if(!name||!detail)return toast("Both fields needed");pl[i]={...pl[i],name:displayName(name),detail}}
  if(act==="del"){if(!confirm("Delete this platform?"))return;pl.splice(i,1)}
  try{await db.collection("cards").doc(c.id).update({platforms:pl,updatedAt:ts()});c.platforms=pl;toast(act==="del"?"Deleted":"Saved ✓");render()}catch(x){toast("Failed to save")}};

/* tabs */
$("#tabs").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const t=b.dataset.t;
  $$("#tabs button").forEach(x=>x.classList.toggle("on",x===b));["users","stats","fb","msg"].forEach(k=>$("#p-"+k).classList.toggle("hide",k!==t));
  if(t==="stats")await renderStats()};
async function renderStats(){
  if(failed.includes("hits")){$("#aBody").innerHTML='<div class="empty">Analytics couldn\'t be loaded. See the orange message above for the reason, then tap Refresh on the Users tab.</div>';return}
  const names={};cardsAll.forEach(c=>names[c.id]=(c.name||"")+(c.label?" ("+c.label+")":""));
  $("#aBody").innerHTML='<h2>Platform-wide analytics</h2><p class="sub">All cards, all users.</p>'+analyticsHtml(hitsAll,{names})}

/* feedback */
function renderFb(){const avg=fbAll.filter(f=>f.rating).reduce((a,f,_,r)=>a+f.rating/r.length,0);
  $("#fbList").innerHTML=(fbAll.length?`<p class="sub" style="margin-top:6px">${fbAll.length} message${fbAll.length===1?"":"s"}${avg?" · average rating "+avg.toFixed(1)+" / 5":""}</p>`:"")+
   (fbAll.length?fbAll.map(f=>`<div class="fb"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(f.name||"Anonymous")} ${f.email?`<span class="sub" style="font-weight:600">· ${esc(f.email)}</span>`:""}</b><span class="sub" style="font-size:.8rem">${when(f.ts)} · ${esc(f.from||"")}</span></div>
     ${f.rating?`<div class="st">${"⭐".repeat(f.rating)}</div>`:""}<p style="margin-top:6px;font-weight:600;overflow-wrap:anywhere">${esc(f.message)}</p><button class="btn ghost" data-id="${f.id}" style="margin-top:8px;padding:8px 14px;color:#d6204a">Delete</button></div>`).join(""):'<div class="empty">No feedback yet.</div>')}
$("#fbList").onclick=async e=>{const b=e.target.closest("button[data-id]");if(!b||!confirm("Delete this feedback?"))return;
  try{await db.collection("feedback").doc(b.dataset.id).delete();fbAll=fbAll.filter(f=>f.id!==b.dataset.id);$("#sF").textContent=fbAll.length;renderFb()}catch(x){toast("Failed")}};

/* messages from the Contact page */
function renderMsgs(){$("#mCnt").textContent=msgsAll.length?"("+msgsAll.length+")":"";
  $("#msgList").innerHTML=msgsAll.length?msgsAll.map(m=>`<div class="fb"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(m.name)} <span class="sub" style="font-weight:600">· ${esc(m.email)}</span></b><span class="sub" style="font-size:.8rem">${when(m.ts)}</span></div>
    <p style="margin-top:6px;font-weight:600;overflow-wrap:anywhere">${esc(m.message)}</p>
    <div class="tools"><a class="btn ghost" style="padding:8px 14px" href="mailto:${esc(m.email)}?subject=${encodeURIComponent("Re: your message to REACH")}">Reply by email</a><button class="btn ghost" data-mid="${m.id}" style="padding:8px 14px;color:#d6204a">Delete</button></div></div>`).join(""):'<div class="empty">No messages yet.</div>'}
$("#msgList").onclick=async e=>{const b=e.target.closest("button[data-mid]");if(!b||!confirm("Delete this message?"))return;
  try{await db.collection("messages").doc(b.dataset.mid).delete();msgsAll=msgsAll.filter(m=>m.id!==b.dataset.mid);renderMsgs()}catch(x){toast("Failed")}};

/* get any user's QR image and business card back */
async function openCardModal(cid){const c=cardsAll.find(x=>x.id===cid);if(!c)return;const u=U.find(x=>x.id===c.owner);
  $("#mcTitle").textContent=(c.name||"Card")+(c.label?" · "+c.label:"");$("#mcSub").textContent=u?u.name+" · "+u.email:"";
  $("#mcBody").innerHTML='<div class="spin" style="margin:30px auto"></div>';$("#mCard").classList.remove("hide");
  try{if(!window.QRCode)await loadJs(QR_URL);
    const url=cardUrl(c.id,"qr"),[qr,fr,bk]=await Promise.all([drawQrCard(c,url),drawFront(c),drawBack(c,url)]);window.__mc={qr,fr,bk,c};
    $("#mcBody").innerHTML=`<div class="copy"><input readonly value="${esc(cardUrl(c.id))}"><button class="btn ghost" id="mcCopy" type="button">Copy link</button></div>
      <h3 class="ah">QR image</h3><div class="mc" id="mcQr"></div><button class="btn" data-dl="qr" type="button">⬇ Download QR image</button>
      <h3 class="ah">Business card front</h3><div class="mc" id="mcFr"></div><button class="btn" data-dl="fr" type="button">⬇ Download front</button>
      <h3 class="ah">Business card back</h3><div class="mc" id="mcBk"></div><button class="btn" data-dl="bk" type="button">⬇ Download back</button>`;
    [["mcQr",qr],["mcFr",fr],["mcBk",bk]].forEach(([id,cv])=>{cv.style.cssText="width:100%;height:auto;border-radius:14px;box-shadow:0 14px 26px -16px rgba(15,58,99,.5)"+(id==="mcQr"?";max-width:320px":"");$("#"+id).appendChild(cv)})}
  catch(e){console.error(e);$("#mcBody").innerHTML='<div class="empty">Couldn\'t build the images. Check your internet and try again.</div>'}}
$("#mcBody").onclick=async e=>{const m=window.__mc;if(!m)return;
  if(e.target.id==="mcCopy"){try{await navigator.clipboard.writeText(cardUrl(m.c.id))}catch(x){}return toast("Link copied ✓")}
  const k=e.target.dataset.dl;if(!k)return;const nm=safeName(m.c.name);
  downloadCanvas(m[k],k==="qr"?nm+"-QR-REACH.png":k==="fr"?nm+"-Business-Card-Front.png":nm+"-Business-Card-Back.png")};
$("#mcClose").onclick=()=>$("#mCard").classList.add("hide");$("#mCard").addEventListener("click",e=>{if(e.target.id==="mCard")$("#mCard").classList.add("hide")});

/* ---------- Excel ---------- */
$("#xl").onclick=async()=>{
  if(!U.length)return toast("No users to export yet");
  try{await loadJs(XLSX_URL)}catch(e){return toast("Couldn't load Excel tool. Check internet.")}
  const keys=[],label={};
  U.forEach(u=>u.cards.forEach(c=>(c.platforms||[]).forEach(p=>{const k=norm(displayName(p.name));if(!label[k]){label[k]=displayName(p.name);keys.push(k)}})));
  const vals=(cs,k)=>cs.flatMap(c=>(c.platforms||[]).filter(p=>norm(displayName(p.name))===k).map(p=>p.detail)).join(" | ");
  const r1=[["Name","Login (email)",...keys.map(k=>label[k]),"Cards","Joined"]];
  U.forEach(u=>r1.push([u.name,u.email,...keys.map(k=>vals(u.cards,k)),u.cards.length,u.createdAt?new Date(u.createdAt).toLocaleDateString("en-GB"):""]));
  const r2=[["Owner","Login (email)","Card","Type","Name on card","Job title","Company","Address","Website","Office phone","Business WhatsApp",...keys.map(k=>label[k]),"Card link","Created"]];
  U.forEach(u=>u.cards.forEach(c=>r2.push([u.name,u.email,c.label||"",c.type||"",c.name||"",c.title||"",c.company||"",c.address||"",c.website||"",c.officePhone||"",c.businessWhatsApp||"",...keys.map(k=>vals([c],k)),cardUrl(c.id),ms(c.createdAt)?new Date(ms(c.createdAt)).toLocaleDateString("en-GB"):""])));
  const wb=XLSX.utils.book_new();
  [["REACH users",r1],["All cards",r2]].forEach(([n,r])=>{const ws=XLSX.utils.aoa_to_sheet(r);ws["!cols"]=r[0].map((_,c)=>({wch:Math.min(40,Math.max(12,...r.map(x=>String(x[c]??"").length+2)))}));XLSX.utils.book_append_sheet(wb,ws,n)});
  XLSX.writeFile(wb,"REACH-users-"+new Date().toISOString().slice(0,10)+".xlsx");toast("Excel downloaded ✓")};
</script></body></html>
