<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · REACH</title>
<meta name="description" content="Get in touch with the REACH team.">
<link rel="icon" href="favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top"><a class="brand" href="./"><img src="logo-mark.png" alt="">REACH</a>
<nav id="nav" class="nav" aria-label="Main"></nav>
<div class="hbtns"><a class="btn accent sm" href="./">Get started</a><button class="burger" id="burger" aria-label="Menu">☰</button></div></header>
<main class="pg">

<section class="phero"><h1>Get in touch</h1><p>Questions, ideas, or need help with your account? Send us a message.</p></section>
<section class="sect"><div class="cols c2">
<div class="card"><h2>Send a message</h2><p class="sub">We read every message.</p>
<form id="cform" novalidate>
<label for="cName">Your name</label><input id="cName" maxlength="60" autocomplete="name">
<label for="cEmail">Your email</label><input id="cEmail" type="email" maxlength="80" autocomplete="email">
<label for="cMsg">Message</label><textarea id="cMsg" rows="5" maxlength="1500" placeholder="How can we help?"></textarea>
<p class="err" id="cErr"></p><button class="btn accent block" id="cBtn" style="margin-top:8px">Send message</button></form></div>
<div class="card"><h2>Other ways to reach us</h2><p class="sub">Choose whatever suits you.</p><div id="cinfo"></div>
<div class="tile" style="margin-top:14px"><h3>Quick answers</h3><p>Many questions are answered on our <a href="faq.html" style="color:var(--a1);font-weight:800">FAQs</a> page.</p></div></div>
</div></section>

</main>
<footer><div id="foot"></div><p>Built by Muhadeen ❤️</p></footer>
<script src="core.js"></script>
<script>
const rows=[["email","✉️","Email",CONTACT.email,v=>"mailto:"+v],["whatsapp","","WhatsApp",CONTACT.whatsapp,v=>"https://wa.me/"+v.replace(/[^\d]/g,"")],["phone","📞","Phone",CONTACT.phone,v=>"tel:"+v.replace(/[^\d+]/g,"")],["address","📍","Address",CONTACT.address,v=>"https://www.google.com/maps/search/"+encodeURIComponent(v)],["hours","🕘","Hours",CONTACT.hours,null]].filter(r=>r[3]);
$("#cinfo").innerHTML=rows.length?rows.map(([k,i,t,v,f])=>{const ic=k==="whatsapp"?logo("WhatsApp",44):`<span class="logo" style="--s:44px">${i}</span>`;const inner=`${ic}<div><b>${t}</b><span>${esc(v)}</span></div>`;return f?`<a class="cinfo" style="text-decoration:none;color:inherit" href="${esc(f(v))}" target="_blank" rel="noopener">${inner}</a>`:`<div class="cinfo">${inner}</div>`}).join(""):'<p class="sub" style="margin:0">Use the form and we will get back to you.</p>';
$("#cform").onsubmit=async e=>{e.preventDefault();const m=$("#cMsg").value.trim(),err=$("#cErr");err.className="err";err.textContent="";
  if(!$("#cName").value.trim())return err.textContent="Please enter your name.";
  if(!$("#cEmail").value.trim())return err.textContent="Please enter your email so we can reply.";
  if(m.length<5)return err.textContent="Please write a short message.";
  $("#cBtn").disabled=true;
  try{const {db}=await fb();await db.collection("messages").add({name:$("#cName").value.trim(),email:$("#cEmail").value.trim(),message:m,ts:ts()});
    $("#cform").reset();err.className="err ok";err.textContent="✅ Thank you! Your message has been sent.";}
  catch(x){console.error(x);err.textContent="Couldn't send right now. Please try again."}
  $("#cBtn").disabled=false};
</script>
</body></html>
